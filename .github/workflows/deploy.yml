# main 에 밀면 mkdocs 가 사이트를 지어 gh-pages 가지에 올린다.
# docs/CNAME 이 함께 올라가므로 커스텀 도메인은 자동으로 잡힌다.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict
      - run: mkdocs gh-deploy --force --no-history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
