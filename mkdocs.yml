site_name: 성경 연구
site_url: https://bible.busangames.com/
site_description: 개인 성경 연구 저장소
repo_url: https://github.com/DavidRheeTaekyoung/bible
edit_uri: edit/main/docs/
copyright: 인용 시 출처를 밝혀 주십시오.

theme:
  name: material
  language: ko
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: 어두운 화면
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: 밝은 화면
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - toc.follow

plugins:
  - search:
      lang:
        - ko
        - en
  - tags

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - admonition
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - assets/extra.css

# nav 를 적지 않는다 — docs/ 의 폴더·파일 이름이 곧 차례다.
# 새 연구는 파일 하나를 폴더에 넣고 커밋하면 끝이다.
